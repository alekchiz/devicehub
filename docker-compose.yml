services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-device_hub}
      POSTGRES_USER: ${POSTGRES_USER:-devicehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      TZ: Europe/Moscow
    command: postgres -c shared_buffers=128MB -c work_mem=1MB -c effective_cache_size=384MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /root/.ssh:/root/.ssh:ro
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  mqtt_listener:
    build: .
    command: python -u manage.py mqtt_listener2
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    command: python -u manage.py telegram_bot
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
