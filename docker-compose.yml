services:
  xray:
    image: teddysun/xray:latest
    restart: unless-stopped
    environment:
      - VLESS_SERVER=${VLESS_SERVER}
      - VLESS_PORT=${VLESS_PORT:-443}
      - VLESS_UUID=${VLESS_UUID}
      - VLESS_PATH=${VLESS_PATH:-/}
      - VLESS_SNI=${VLESS_SNI:-}
      - VLESS_ALPN=${VLESS_ALPN:-http/1.1}
      - VLESS_FP=${VLESS_FP:-chrome}
      - XRAY_SOCKS_PORT=1080
      - XRAY_HTTP_PORT=8118
    volumes:
      - ./xray/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh"]
    command: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8118/"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-device_hub}
      POSTGRES_USER: ${POSTGRES_USER:-devicehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      TZ: Europe/Moscow
    command: postgres -c shared_buffers=128MB -c work_mem=1MB -c effective_cache_size=384MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 5 --timeout 60"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /root/.ssh:/root/.ssh:ro
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Каталог для HTTP-01 валидации LetsEncrypt (отдаёт nginx, пишет certbot).
      - /var/www/certbot:/var/www/certbot:rw
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  mqtt_listener:
    build: .
    command: python -u manage.py mqtt_listener2
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  celery:
    build: .
    command: python -m celery -A core worker --loglevel=info --concurrency=2
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - .:/app
      - /root/.ssh:/root/.ssh:ro
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    command: python -u manage.py telegram_bot
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings_docker
      - DB_HOST=db
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - /etc/hosts:/etc/hosts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
