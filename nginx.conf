server {
    listen 80;
    server_name support-pak.ru www.support-pak.ru;
    # Валидация Let's Encrypt (HTTP-01) должна отдаваться на 80-порту,
    # иначе автообновление сертификата упрётся в редирект на https.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name support-pak.ru www.support-pak.ru;

    ssl_certificate /etc/letsencrypt/live/support-pak.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support-pak.ru/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Динамический резолвинг web через Docker DNS: при пересоздании контейнера
    # web (новый IP) nginx подхватывает его без перезапуска.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        set $backend "web:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
